CONFIG_LOG=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_IPV4=y

# Enable DNS resolver
CONFIG_DNS_RESOLVER=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y

# Watches the interface and raises NET_EVENT_L4_CONNECTED once up.
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y

CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
